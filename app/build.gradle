plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.kartikmodi.cricfyremote'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.kartikmodi.cricfyremote'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Built and sideloaded by the person installing it, never published: the debug key is enough.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
